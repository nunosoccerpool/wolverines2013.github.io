<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolverines Stats</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-lockup">
        <img class="team-logo" src="./images/TW-logo.jpg" alt="Wolverines Logo" />
        <div class="brand-text">
          <h1 id="page-title">Wolverines Stats</h1>
          <p id="page-subtitle" class="subtitle">U14A (2013)</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="summary-cards" class="cards-grid" aria-label="Team Summary KPIs"></section>

    <nav class="tab-bar" role="tablist" aria-label="Statistics Views">
      <button class="tab-btn active" data-tab="playerSeasonTotals" role="tab" aria-selected="true">Season Totals</button>
      <button class="tab-btn" data-tab="gameDetails" role="tab" aria-selected="false">Game Details</button>
      <button class="tab-btn" data-tab="scoring" role="tab" aria-selected="false">Scoring</button>
      <button class="tab-btn" data-tab="specialTeams" role="tab" aria-selected="false">Special Teams</button>
      <button class="tab-btn" data-tab="goalies" role="tab" aria-selected="false">Goalies</button>
      <button class="tab-btn" data-tab="summary" role="tab" aria-selected="false">Summary</button>
      <button class="tab-btn" data-tab="coachesCorner" role="tab" aria-selected="false">Coaches' Corner</button>
    </nav>

    <div class="controls-row">
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="Filter rows..."
        aria-label="Filter rows"
      />
      <div id="row-count" class="row-count"></div>
    </div>

    <div id="status-banner" class="status-banner hidden" role="alert"></div>

    <div class="table-wrap">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
